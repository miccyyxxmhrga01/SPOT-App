<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#26251F">
  <h2 style="margin:0 0 8px">Welcome to SPOT</h2>
  <p style="margin:0 0 16px;color:#74746C">Enter this code in the SPOT app to verify your email:</p>
  <p style="margin:0 0 16px;font-size:32px;font-weight:bold;letter-spacing:8px;background:#FFF1CB;color:#785B13;padding:16px 24px;border-radius:12px;display:inline-block">{{ .Token }}</p>
  <p style="margin:0 0 24px;color:#74746C;font-size:13px">The code expires soon. If you asked for a new one, use the newest code.</p>
  <p style="margin:0 0 8px;color:#74746C;font-size:13px">Using an older version of SPOT? <a href="{{ .ConfirmationURL }}" style="color:#785B13">Confirm your email with this link</a> instead.</p>
  <p style="margin:0;color:#A8A69B;font-size:12px">If you didn't create a SPOT account, you can ignore this email.</p>
</div>
